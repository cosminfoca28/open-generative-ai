name: Free Studio source checks
on:
  pull_request:
    paths:
      - 'app/free-studio/**'
      - 'app/api/free-image/**'
      - 'lib/free-studio.mjs'
      - 'middleware.js'
      - 'tests/freeStudio.test.mjs'
      - '.github/workflows/free-studio-checks.yml'
  push:
    branches: [feature/free-mobile-images]
    paths:
      - 'app/free-studio/**'
      - 'app/api/free-image/**'
      - 'lib/free-studio.mjs'
      - 'middleware.js'
      - 'tests/freeStudio.test.mjs'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline Free Studio tests
        run: node --test tests/freeStudio.test.mjs
